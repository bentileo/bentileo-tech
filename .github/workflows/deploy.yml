name: Deploy

# Every push to main builds the site and publishes dist/ to the server, so a
# merge is a deploy. Needs two repository secrets:
#   DEPLOY_SSH_KEY   private key (ed25519) whose public half is in
#                    leo@72.60.123.80:~/.ssh/authorized_keys
#   DEPLOY_KNOWN_HOSTS  output of: ssh-keyscan 72.60.123.80

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Make files world-readable
        run: chmod -R a+rX dist
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Publish
        run: rsync --archive --delete --compress dist/ leo@72.60.123.80:/var/www/bentileo.tech/
